<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root {
      --bg: #FAFAF8;
      --fg: #111111;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E0E0D;
        --fg: #F2F1EC;
      }
    }
    rect { fill: var(--bg); }
    text { fill: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 18px; }
  </style>
  <rect width="32" height="32" rx="6"/>
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle">P</text>
</svg>
